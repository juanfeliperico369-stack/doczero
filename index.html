:root{--bg:#000;--pn:#05010b;--pn2:#0b0418;--ink:#39c8ff;--ink2:#8fb3ff;--dim:#5d6c9a;--pur:#a42cff;--pur2:#4d1785;--mag:#ff2fb3;--amb:#ffc23a;--grn:#2dffb3;--wht:#e9f6ff;
--fd:"Titulos","Arial Narrow",Impact,sans-serif;--fb:"Cuerpo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fm:ui-monospace,"Roboto Mono",Consolas,monospace;--fs:Georgia,"Times New Roman",serif;
--glow:0 0 8px rgba(57,200,255,.55);--pglow:0 0 10px rgba(164,44,255,.45);--side:270px;--navw:74px;--hudh:42px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
sub,sup{font-size:.68em;line-height:0}
p{margin:6px 0;line-height:1.45}
/* ---------- tipografía de revista ---------- */
.mega{font-family:var(--fd);text-transform:uppercase;line-height:.86;color:var(--ink);text-shadow:var(--glow);margin:0;font-weight:400}
.kick{font-family:var(--fs);font-style:italic;color:var(--mag);font-size:15px;margin:4px 0}
.spaced{font-family:var(--fb);font-weight:800;letter-spacing:.38em;text-transform:uppercase;color:var(--wht)}
.boxed{border:4px solid var(--pur);padding:6px 12px;box-shadow:var(--pglow),inset 0 0 18px rgba(164,44,255,.12);display:inline-block;margin:6px 0}
.ok-b{border-color:var(--grn)!important}.bad-b{border-color:var(--mag)!important}
.outline{font-family:var(--fd);color:transparent;-webkit-text-stroke:2px var(--ink);line-height:.8}
.film{position:relative;background:#000;border:1px solid #2a2a33;padding:20px 12px;font-family:var(--fm);text-transform:uppercase;font-size:12px;line-height:1.5;letter-spacing:.05em;color:var(--wht)}
.film:before,.film:after{content:"";position:absolute;left:6px;right:6px;height:9px;background:repeating-linear-gradient(90deg,var(--pur2) 0 10px,transparent 10px 22px);border-radius:2px}
.film:before{top:5px}.film:after{bottom:5px}
.pag{font-family:var(--fb);font-weight:800;font-size:10.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.adv{display:inline-block;border:2px solid var(--wht);color:var(--wht);font-family:var(--fd);text-align:center;line-height:.9;padding:3px 6px;font-size:11px;text-transform:uppercase}
.adv b{display:block;font-size:16px;background:var(--wht);color:#000;margin:2px -6px;padding:1px 4px;font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--pur);padding:8px 14px;font-family:var(--fd);font-size:18px;text-transform:uppercase;letter-spacing:.03em;color:var(--wht);background:var(--pn2);box-shadow:var(--pglow);min-height:42px}
.btn.pri{background:var(--pur);color:#fff;border-color:#d08cff}
.btn.gh{box-shadow:none;border-color:var(--pur2);color:var(--ink2);background:transparent}
.btn.sm{min-height:32px;padding:3px 10px;font-size:14px}
.btn.wide{width:100%}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.35;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sticky{position:sticky;bottom:-14px;background:#000;padding:8px 0;margin-top:10px}
.m{color:var(--ink2)}.sm{font-size:12px}.w{color:var(--wht)}.ok{color:var(--grn)}.bad{color:var(--mag)}.gold{color:var(--amb)}
.hl{color:var(--amb);text-shadow:0 0 8px rgba(255,194,58,.6)}
.hint{animation:hint 1s ease-in-out infinite!important;border-color:var(--amb)!important}
@keyframes hint{50%{box-shadow:0 0 0 3px rgba(255,194,58,.55),0 0 18px rgba(255,194,58,.7)}}
/* ---------- estructura horizontal ---------- */
#app{display:grid;height:100%;grid-template-columns:var(--navw) minmax(0,1fr) var(--side);grid-template-rows:var(--hudh) minmax(0,1fr);grid-template-areas:"hud hud hud" "nav stage side"}
#hud{grid-area:hud;display:flex;align-items:center;gap:6px;border-bottom:3px solid var(--pur);background:linear-gradient(90deg,var(--pur2),var(--pn) 40%);padding-left:10px;min-width:0}
.brand{font-family:var(--fd);font-size:22px;color:var(--wht);text-shadow:var(--glow);text-transform:uppercase;white-space:nowrap;margin-right:6px}
.brand b{color:var(--ink);margin-left:5px;font-weight:400}
.chip{border:1px solid var(--pur2);padding:2px 7px;font-family:var(--fm);font-size:11.5px;white-space:nowrap;color:var(--ink2);background:#000}
.chip b{color:var(--ink)}.chip.en b{color:var(--amb)}.chip.rk{color:var(--grn)}
.sp{flex:1}
.hb2{width:44px;height:100%;border-left:2px solid var(--pur2);font-size:19px;color:var(--ink)}
#nav{grid-area:nav;display:flex;flex-direction:column;border-right:2px solid var(--pur2);background:var(--pn)}
#nav button{flex:1;max-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--fm);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--pur2);position:relative}
#nav button i{font-style:normal;font-size:22px}
#nav button.on{color:var(--ink);background:var(--pn2);text-shadow:var(--glow)}
#nav button.on:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pur);box-shadow:var(--pglow)}
#nav .dot{position:absolute;top:8px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--mag)}
#stage{grid-area:stage;position:relative;min-width:0;min-height:0}
#side{grid-area:side;border-left:2px solid var(--pur2);background:var(--pn);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.tab{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.tab.on{display:flex}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0;padding:10px 12px}
/* comunicaciones (personajes) */
#comms{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:8px;border-bottom:2px solid var(--pur2);cursor:pointer;position:relative;min-height:84px}
#comms .por{width:62px;height:62px}
#comms.who-doc{background:linear-gradient(135deg,rgba(57,200,255,.08),transparent)}
#comms.who-eter{background:linear-gradient(135deg,rgba(164,44,255,.12),transparent)}
#comms.say .cb{animation:tin .3s ease-out}
.cb b{font-family:var(--fm);font-size:10px;letter-spacing:.2em;color:var(--amb)}
.cb p{margin:3px 0 0;font-size:12.5px;color:var(--wht);line-height:1.35}
#cNext{position:absolute;right:6px;bottom:6px;border:1px solid var(--amb);color:var(--amb);padding:2px 8px;font-size:12px;animation:hint 1.2s infinite}
.por{border:2px solid var(--pur);background:radial-gradient(circle at 50% 40%,#1a0636,#000 70%);border-radius:50%;overflow:hidden;flex:none}
.por svg{width:100%;height:100%;display:block}
.por.big{width:120px;height:120px}
.por.huge{width:min(34vh,240px);height:min(34vh,240px)}
.pt-eter{animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-3px)}}
#mis{padding:8px 10px;border-bottom:2px solid var(--pur2);display:flex;flex-direction:column;gap:5px}
#mis .mt{font-family:var(--fd);font-size:22px;text-transform:uppercase;color:var(--wht);line-height:.95}
#mis .obj{font-size:13px;color:var(--ink)}
#mis .dsc{font-size:12px;color:var(--ink2);margin:0;max-height:110px;overflow-y:auto}
.chk{display:flex;flex-wrap:wrap;gap:4px}
.chk span{border:1px solid var(--pur2);padding:1px 6px;font-family:var(--fm);font-size:12px}
.chk span.ok{border-color:var(--grn)}
.tbar{height:6px;border:1px solid var(--pur2);position:relative}
.tbar i{position:absolute;left:0;top:0;bottom:0;background:var(--amb)}
.tm{font-family:var(--fd);font-size:22px;color:var(--amb)}
.tm.low{color:var(--mag);animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
#ana{padding:8px 10px;font-size:12.5px;line-height:1.5}
#ana .fm{font-family:var(--fd);font-size:20px;color:var(--wht)}
/* ---------- laboratorio ---------- */
.lmode{flex:none;display:flex;border-bottom:1px solid var(--pur2)}
.lmode button{flex:1;padding:6px;font-family:var(--fd);font-size:16px;text-transform:uppercase;color:var(--dim);letter-spacing:.05em;border-right:1px solid var(--pur2)}
.lmode button.on{color:var(--wht);background:linear-gradient(180deg,var(--pn2),#000);text-shadow:var(--glow);box-shadow:inset 0 -3px 0 var(--pur)}
.pane{flex:1;min-height:0;display:flex;flex-direction:column}
.pane[hidden]{display:none}
#cvWrap{flex:1;min-height:120px;position:relative;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 45%,#0d0420,#000 75%)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#coach{position:absolute;left:58px;right:58px;top:8px;font-size:14px;color:var(--wht);pointer-events:none;line-height:1.35;text-align:center;text-shadow:0 0 4px #000,0 0 8px #000}
.cvb{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:5px}
.cvb button,.tools-v button{width:40px;height:40px;border:1px solid var(--pur2);background:rgba(5,1,11,.85);font-size:17px;color:var(--ink2)}
.tools-v{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:5px}
.tools-v #bAH{color:var(--amb);font-family:var(--fd);font-size:17px}
.syn{position:absolute;right:10px;bottom:10px;font-family:var(--fd);font-size:21px;text-transform:uppercase;color:#fff;background:var(--pur);border:2px solid #d08cff;box-shadow:var(--pglow);padding:8px 16px;min-height:46px}
#tray{flex:none;height:66px;overflow-x:auto;overflow-y:hidden;display:flex;gap:6px;padding:6px 8px;border-top:2px solid var(--pur2);background:var(--pn);align-items:center}
.tsec{flex:none;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--fm);font-size:9px;letter-spacing:.2em;color:var(--dim);border-left:1px solid var(--pur2);padding-right:2px;height:100%;text-align:center}
.at{flex:none;width:54px;height:54px;border:2px solid var(--c,var(--ink));background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;line-height:1}
.at .s{font-family:var(--fd);font-size:22px;color:var(--wht)}
.at .z{position:absolute;left:3px;top:2px;font-size:9px;color:var(--dim)}
.at .v{position:absolute;right:2px;top:2px;font-size:9px;color:var(--c)}
.at .n{font-size:8.5px;color:var(--ink2);margin-top:3px;max-width:50px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.at.mono{width:88px;border-style:dashed}
.at.mono .s{font-size:16px}
/* reactor */
.rx{padding:10px 12px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:8px}
.rx>*{flex:none}
.eq{display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-height:84px;border:2px solid var(--pur2);padding:8px;background:var(--pn)}
.term{display:flex;align-items:center;gap:3px}
.cf{display:flex;flex-direction:column;align-items:center}
.cf button{width:26px;height:20px;border:1px solid var(--pur2);font-size:13px;line-height:1}
.cf b{font-family:var(--fd);font-size:22px;color:var(--amb);font-weight:400}
.sub{border:2px solid var(--ink);padding:4px 8px;display:flex;flex-direction:column;align-items:center;font-family:var(--fd);font-size:20px;color:var(--wht);background:#000;min-width:56px}
.sub small{font-family:var(--fb);font-size:9px;color:var(--ink2);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op{font-family:var(--fd);font-size:22px;color:var(--pur)}
.arrow{font-family:var(--fd);font-size:30px;color:var(--amb);margin:0 6px}
.bal{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.bal span{font-family:var(--fm);font-size:12px;border:1px solid var(--pur2);padding:1px 5px}
/* forja */
.forge{padding:10px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;overflow-y:auto;flex:1}
.fcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.slots{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.slot{width:68px;height:68px;border:3px solid var(--pur);display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;font-family:var(--fd);font-size:22px;color:var(--wht)}
.slot.empty{border-style:dashed;border-color:var(--pur2);color:var(--dim);font-size:28px}
.slot small{font-family:var(--fb);font-size:9px;color:var(--ink2);margin-top:2px}
.plus{font-family:var(--fd);font-size:22px;color:var(--pur)}
.flux{display:flex;align-items:center;gap:3px;border:3px solid var(--pur2);padding:3px;height:68px}
.flux button{width:28px;height:28px;border:1px solid var(--pur2);font-size:17px}
.flux span{font-family:var(--fd);font-size:22px;min-width:46px;text-align:center;color:var(--wht)}
.prev{border:2px solid var(--pur2);padding:8px;font-size:13px;min-height:60px;background:var(--pn)}
.prev .big{font-family:var(--fd);font-size:26px;color:var(--wht)}
.nucs{display:flex;flex-wrap:wrap;gap:6px}
.nuc{min-width:54px;height:46px;border:2px solid var(--c,var(--ink));padding:0 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--fd);font-size:18px;color:var(--wht);background:#000}
.nuc small{font-family:var(--fb);font-size:8.5px;color:var(--ink2);max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flog{font-family:var(--fm);font-size:11px;color:var(--dim);line-height:1.5}
.fuseFx{animation:fuse .6s ease-out}
@keyframes fuse{30%{filter:brightness(3) saturate(2);transform:scale(1.02)}}
/* ---------- frascos ---------- */
.filt{flex:none;display:flex;gap:6px;overflow-x:auto;padding:7px 10px;border-bottom:1px solid var(--pur2)}
.filt button{border:1px solid var(--pur2);padding:5px 9px;font-size:10.5px;letter-spacing:.12em;font-family:var(--fm);white-space:nowrap;color:var(--dim);text-transform:uppercase}
.filt button.on{border-color:var(--pur);color:var(--ink);background:var(--pn2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:7px}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.card{border:2px solid var(--pur2);background:var(--pn);padding:7px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:104px;position:relative}
.card .f{font-family:var(--fd);font-size:21px;color:var(--wht);line-height:1}
.card .nm{font-size:12px;color:var(--ink);line-height:1.2}
.card .k{position:absolute;right:5px;top:5px;font-family:var(--fm);font-size:9px;letter-spacing:.1em;color:var(--dim)}
.card.hyb{border-style:dashed;border-color:var(--mag)}.card.poly{border-color:var(--grn)}.card.el{border-color:var(--c)}
.card.sel{border-color:var(--amb);box-shadow:0 0 10px rgba(255,194,58,.4)}
.tg{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto}
.tg i{font-style:normal;font-size:10px;border:1px solid var(--pur2);padding:1px 4px;color:var(--ink2);white-space:nowrap}
.ptab{display:grid;grid-template-columns:repeat(18,minmax(20px,1fr));gap:2px;min-width:540px}
.ptab button{aspect-ratio:1;border:1px solid #1c1530;font-family:var(--fd);font-size:13px;color:#2d2945;display:flex;align-items:center;justify-content:center}
.ptab button.on{color:#fff;border-color:var(--c);text-shadow:0 0 6px var(--c)}
.ptab button.det{color:var(--c);border-style:dashed}
.ptab .gap{grid-column:1/-1;height:6px}
.sect{display:flex;align-items:flex-end;gap:10px;margin-bottom:6px}
.sect .outline{font-size:78px}
.sect .mega{font-size:clamp(32px,6vw,56px)}
/* ---------- mapa ---------- */
.lvls{flex:none;display:flex;gap:5px;overflow-x:auto;padding:6px 10px;border-bottom:1px solid var(--pur2)}
.lvls button{min-width:40px;height:36px;border:2px solid var(--pur2);font-family:var(--fd);font-size:19px;color:var(--dim)}
.lvls button.on{border-color:var(--pur);color:var(--wht);background:var(--pn2);box-shadow:var(--pglow)}
.lvls button.done{color:var(--grn)}.lvls button.lock{opacity:.3}
.map{position:relative;height:230px;overflow-x:auto;overflow-y:hidden;border:2px solid var(--pur2);background:radial-gradient(1px 1px at 20% 30%,#fff8,transparent),radial-gradient(1px 1px at 70% 60%,#fff6,transparent),radial-gradient(1.5px 1.5px at 45% 80%,#c77dff88,transparent),radial-gradient(1px 1px at 85% 20%,#39c8ff88,transparent),radial-gradient(ellipse at 30% 50%,#1a0636 0,#000 70%);background-size:180px 120px,240px 160px,300px 200px,200px 140px,100% 100%}
.mapin{position:relative;height:100%;width:1000px}
.mapin svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border:3px solid var(--pur);background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--wht);box-shadow:var(--pglow)}
.node .ic{font-size:19px;line-height:1}.node .nn{font-family:var(--fd);font-size:14px}
.node .st{position:absolute;bottom:-16px;font-size:11px;color:var(--amb);white-space:nowrap}
.node.boss{width:76px;height:76px;margin:-38px 0 0 -38px;border-color:var(--mag);box-shadow:0 0 12px rgba(255,47,179,.5)}
.node.lock{opacity:.3;box-shadow:none}.node.done{border-color:var(--grn)}
.node.next{animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 22px rgba(57,200,255,.9);border-color:var(--ink)}}
.txg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.tx-card{border:3px solid var(--pur2);padding:10px;display:flex;gap:10px;align-items:center;text-align:left;background:var(--pn)}
.tx-card .outline{font-size:52px;flex:none}.tx-card.lock{opacity:.35}
.tx3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gcols{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 14px}
.sec-t{font-family:var(--fm);font-size:10.5px;letter-spacing:.28em;color:var(--amb);margin:10px 0 5px;text-transform:uppercase}
/* ---------- modal ---------- */
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;padding:10px}
.ov[hidden]{display:none}
.sheet{width:min(100%,820px);max-height:100%;overflow-y:auto;background:#000;border:3px solid var(--pur);box-shadow:var(--pglow);padding:14px 16px;position:relative}
.sheet .x{position:absolute;right:8px;top:8px;width:34px;height:34px;border:1px solid var(--pur2);font-size:15px;z-index:2}
.sheet h2.mega{font-size:clamp(32px,6vw,54px);margin:6px 0}
.sheet p{color:var(--ink2)}
.res{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.det2{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;margin-top:8px}
.stars{font-size:30px;color:var(--amb);letter-spacing:.1em;text-shadow:0 0 10px rgba(255,194,58,.6)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.kv b{color:var(--dim);font-weight:600}
.mini{max-width:100%;height:auto;border:1px dashed var(--pur2);display:block}
/* ---------- portada / historia ---------- */
.cover{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;overflow-y:auto}
.cband{display:flex;min-height:44px;background:var(--pur2);border-bottom:3px solid var(--pur);flex:none}
.cband>div{flex:1;display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.36em;font-size:12px;color:#fff;text-transform:uppercase;text-align:center;padding:4px}
.cband>div+div{background:#000;color:var(--ink);border:2px solid var(--pur);margin:4px;letter-spacing:.2em;font-weight:600}
.cgrid{flex:1;display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:center;padding:10px 24px;max-width:1200px;margin:0 auto;width:100%}
.ctitle{position:relative;text-align:left}
.ctitle .srf{font-family:var(--fs);color:var(--wht);text-transform:uppercase;font-size:clamp(11px,1.6vw,16px);letter-spacing:.03em}
.ctitle .mega{font-size:clamp(70px,17vh,190px)}
.ctitle .mega.b2{font-size:clamp(58px,14vh,160px);margin-top:-.05em}
.cside{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.cpor{display:flex;gap:12px}.cpor .por{width:min(22vh,140px);height:min(22vh,140px)}
.ctag{font-family:var(--fd);text-transform:uppercase;font-size:clamp(24px,5vh,46px);line-height:.88;color:var(--grn);text-shadow:0 0 10px rgba(45,255,179,.45)}
.cbtns{display:flex;flex-direction:column;gap:8px;width:min(100%,320px)}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 14px;background:var(--pn2);border-top:3px solid var(--pur);flex:none}
.cfoot .mega{font-size:18px;color:var(--wht)}
.sgrid{flex:1;display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;padding:12px 28px;max-width:1100px;margin:0 auto;width:100%}
.stext{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.stext .film{font-size:clamp(13px,2.4vh,18px);width:100%}
/* ---------- batalla / destilación ---------- */
#battle,#sortOv{position:fixed;inset:0;z-index:45;background:#000;display:flex;flex-direction:column}
#battle[hidden],#sortOv[hidden]{display:none}
.bt-top{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:3px solid var(--pur);flex:none}
.bt-top .mega{font-size:24px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-top .tm{font-size:28px}
.bt-main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,36%)}
.bt-left{display:flex;flex-direction:column;min-height:0}
.bars{padding:6px 10px;display:grid;gap:5px}
.hb{height:12px;border:1px solid var(--pur2);position:relative;background:#09040f}
.hb i{position:absolute;left:0;top:0;bottom:0;background:var(--mag);transition:width .15s}
.hb.ship i{background:var(--grn)}
.hb span{position:absolute;right:4px;top:-2px;font-size:10px;font-family:var(--fm);color:#fff}
.arena{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.tw{position:relative;width:min(30vh,200px);aspect-ratio:1}
.threat{position:absolute;inset:0;border-radius:50%;border:4px solid var(--mag);display:flex;align-items:center;justify-content:center;font-size:min(14vh,90px);color:var(--mag);text-shadow:0 0 20px var(--mag);box-shadow:0 0 30px rgba(255,47,179,.35),inset 0 0 40px rgba(255,47,179,.25);animation:breathe 2.4s ease-in-out infinite}
.ring{position:absolute;inset:-4px;border-radius:50%;border:3px solid rgba(255,194,58,.55);pointer-events:none}
.ring.on{border-color:var(--amb);box-shadow:0 0 22px var(--amb),inset 0 0 18px rgba(255,194,58,.5)}
@keyframes breathe{50%{transform:scale(1.04)}}
.threat.hit{animation:hit .25s}
@keyframes hit{30%{transform:scale(.9) rotate(-4deg);filter:brightness(2)}}
.phase{font-size:12.5px;color:var(--ink2);margin:10px 14px 0;text-align:center;min-height:30px}
.combo{position:absolute;top:8px;right:12px;font-family:var(--fd);font-size:32px;color:var(--amb);text-shadow:0 0 10px var(--amb)}
.pop{position:absolute;font-family:var(--fd);font-size:28px;pointer-events:none;animation:pop .9s ease-out forwards;text-shadow:0 0 8px currentColor;white-space:nowrap}
@keyframes pop{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
.shot{position:absolute;width:16px;height:16px;border-radius:50%;box-shadow:0 0 12px currentColor;pointer-events:none;transition:transform .28s ease-in,opacity .28s;z-index:3}
.deck{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:6px;padding:8px;border-left:3px solid var(--pur);align-content:stretch}
.dk{position:relative;border:2px solid var(--pur);min-height:70px;padding:6px 4px;background:var(--pn);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center}
.dk .f{font-family:var(--fd);font-size:20px;color:var(--wht);line-height:1}
.dk .nm{font-size:10.5px;color:var(--ink2);line-height:1.15}
.dk .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(164,44,255,.35);pointer-events:none}
.tipc{grid-column:1/-1;margin:0;text-align:center}
.sbody{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:10px}
.tubes{display:flex;gap:clamp(6px,1.6vw,18px);align-items:flex-end;flex-wrap:wrap;justify-content:center}
.tube{width:clamp(44px,6vw,64px);height:clamp(150px,44vh,230px);border:3px solid var(--ink2);border-top:0;border-radius:0 0 24px 24px;display:flex;flex-direction:column-reverse;padding:3px;gap:2px;transition:transform .15s;background:rgba(57,200,255,.04)}
.tube.sel{transform:translateY(-14px);border-color:var(--amb);box-shadow:0 0 14px rgba(255,194,58,.5)}
.tube i{flex:0 0 calc(25% - 2px);border-radius:4px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 8px rgba(0,0,0,.35)}
.tube i:first-child{border-radius:4px 4px 18px 18px}
.tube i span{font-family:var(--fd);font-size:12px;color:#000;opacity:.75}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
/* ---------- toast / fx ---------- */
#toast{position:fixed;right:8px;bottom:8px;z-index:70;display:flex;flex-direction:column;gap:5px;align-items:stretch;pointer-events:none;width:calc(var(--side) - 12px)}
#toast div{background:#000;border:2px solid var(--pur);padding:6px 10px;font-size:12.5px;color:var(--wht);box-shadow:var(--pglow);animation:tin .25s ease-out;text-align:center}
#toast div.bad{border-color:var(--mag)}#toast div.ok{border-color:var(--grn)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.boom{position:fixed;z-index:65;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fff 0,var(--amb) 25%,var(--mag) 55%,transparent 70%);animation:boom .6s ease-out forwards}
@keyframes boom{to{transform:scale(8);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}
/* ---------- girar el dispositivo ---------- */
#rotate{display:none;position:fixed;inset:0;z-index:90;background:#000;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
#rotate .phone{width:60px;height:100px;border:4px solid var(--ink);border-radius:10px;animation:rot 2s ease-in-out infinite;box-shadow:var(--glow)}
@keyframes rot{40%,70%{transform:rotate(-90deg)}}
#rotate .mega{font-size:40px}
@media (orientation:portrait) and (max-width:900px){body:not(.vok) #rotate{display:flex}}
/* ---------- teléfonos en horizontal (altura baja) ---------- */
@media (max-height:520px){:root{--side:226px;--navw:62px;--hudh:36px}.brand{font-size:18px}.chip.rk{display:none}#comms{grid-template-columns:48px 1fr;min-height:66px;padding:6px}#comms .por{width:48px;height:48px}.cb p{font-size:11.5px}#mis .mt{font-size:18px}#mis .dsc{max-height:52px}#tray{height:60px}.at{width:48px;height:48px}.at .s{font-size:19px}.syn{font-size:18px;padding:6px 12px;min-height:40px}.cvb button,.tools-v button{width:34px;height:34px;font-size:15px}.map{height:200px}.sheet h2.mega{font-size:34px}.por.big{width:84px;height:84px}.lmode button{font-size:14px;padding:4px}.tube{height:clamp(120px,46vh,200px)}.bt-top .mega{font-size:20px}}
@media (max-width:760px) and (orientation:landscape){.chip#hSc{display:none}.ctitle .mega{font-size:16vh}}

      const tag = L.n + '-' + (i + 1) + ' ' + p.t + ': '; n[p.k] = (n[p.k] || 0) + 1;
      if (!p.t || !p.d || !(p.T > 0)) E.push(tag + 'texto o tiempo faltante');
      const can = id => id[0] === '@' ? els.has(id.slice(1)) : (DB.comp[id] && (elsOf(id).every(e => els.has(e)) || made.has(id)));
      if (p.k === 'm') { if (!DB.comp[p.id]) E.push(tag + 'compuesto inexistente ' + p.id); else { const miss = elsOf(p.id).filter(e => !els.has(e)); if (miss.length) E.push(tag + 'faltan elementos ' + miss.join(',')); made.add(p.id); } }
      else if (p.k === 'p') { const q = DB.poly[p.id]; if (!q) E.push(tag + 'polímero inexistente'); else { if (L.n < 8) E.push(tag + 'polímeros se desbloquean en el nivel 8'); q.ms.forEach(m => { if (!can(m)) E.push(tag + 'monómero imposible ' + m); }); } }
      else if (p.k === 'r') {
        const rx = REACT.rx[p.id]; if (!rx) { E.push(tag + 'reacción inexistente ' + p.id); return; }
        rx.L.forEach(([, x]) => { if (!can(x)) E.push(tag + 'reactivo imposible todavía: ' + x); });
        if (-REACT.energy(rx) > CFG.MAX_ENERGY) E.push(tag + 'cuesta demasiada energía');
        rx.R.forEach(([, x]) => { if (x[0] === '@') els.add(x.slice(1)); else made.add(x); });
      } else if (p.k === 's') {
        if (!(p.n >= 2 && p.n <= 8) || !p.mix || p.mix.length < p.n) E.push(tag + 'destilación mal definida');
        (p.mix || []).forEach(x => { if (!DB.comp[x]) E.push(tag + 'sustancia inexistente ' + x); });
        for (let f = 0; f < 3; f++) if (!SORT.gen(p.n, L.n * 1000 + i * 17 + f)) E.push(tag + 'puzzle sin solución (semilla ' + f + ')');
      } else if (p.k === 'f') {
        const { it, fl } = recipe(p.r), ins = it.map(k => NUC.parse(k));
        it.forEach(k => { if (!nucs.has(k)) E.push(tag + 'la receta usa ' + k + ' que aún no se puede tener'); });
        const r = NUC.fuse(ins, fl);
        if (!r.ok) { E.push(tag + 'receta falla: ' + r.msg); return; }
        if (r.prod.z !== p.z || (p.a && r.prod.a !== p.a)) E.push(tag + 'receta da Z' + r.prod.z + ' A' + r.prod.a);
        if (p.isl && r.kind !== 'island') E.push(tag + 'no cae en la isla');
        if (!p.det && r.kind === 'shv') E.push(tag + 'producto inestable');
        if (-r.net > CFG.MAX_ENERGY) E.push(tag + 'cuesta más energía que el máximo');
        if (r.kind !== 'shv') { nucs.add(NUC.key(r.prod.z, r.prod.a)); const s = D.elem(r.prod.z).sym; if (D.SYM[s] || r.prod.z === 126) els.add(s); }
      } else if (p.k === 'b') {
        [p.w, p.h, p.ph2 && p.ph2.w, p.ph2 && p.ph2.h].filter(Boolean).forEach(s => Object.keys(D.parseTags(s)).forEach(t => { if (!TAGS[t]) E.push(tag + 'etiqueta ' + t); }));
        if (!(p.hp > 0 && p.dps > 0) || !p.sc) E.push(tag + 'datos de batalla incompletos');
        const cards = pool(els, L.n, made), r = simBattle(p, cards, L.n);
        if (!r.ok) E.push(tag + 'no se puede ganar con lo disponible (' + (r.why || 't=' + r.t.toFixed(1) + 's, daño ' + r.loss.toFixed(0) + '%') + ')');
        const eff = cards.filter(c => BAT.eff(c, BAT.phaseOf(p, 1)) > 0);
        if (eff.length < 2) W.push(tag + 'solo ' + eff.length + ' carta efectiva');
      } else E.push(tag + 'tipo desconocido ' + p.k);
    });
  });
  return { ok: !E.length, errors: E, warnings: W, stats: Object.keys(DB.comp).length + ' compuestos · ' + Object.keys(DB.poly).length + ' polímeros · ' + Object.keys(REACT.rx).length + ' reacciones · ' + n.m + ' síntesis · ' + n.r + ' reacciones · ' + n.f + ' forjas · ' + n.p + ' polímeros · ' + n.s + ' destilaciones · ' + n.b + ' batallas' };
}

/* juega como una persona que sabe la respuesta */
function prep(U, S, p) { // antes de una batalla crea las mejores cartas posibles con lo descubierto
  const els = new Set(D.labElements(S)), L = S.cur, ph = [BAT.phaseOf(p, 1), p.ph2 ? BAT.phaseOf(p, 2) : null].filter(Boolean);
  const best = pool(els, L).map(c => ({ c, v: Math.max(...ph.map(q => BAT.eff(c, q))) * c.pow })).filter(x => x.v > 0).sort((a, b) => b.v - a.v).slice(0, 4);
  best.forEach(({ c }) => {
    if (S.fr[c.id] || c.kind === 'el') return; U.clearLab(true);
    if (c.kind === 'mol') U.buildSmiles(DB.comp[c.id].smiles[0]);
    else { const ms = DB.poly[c.id].ms; U.Lab.sel = null; for (let q = 0; q < Math.max(3, ms.length * 2); q++) U.spawnMono(ms[q % ms.length]); }
    U.synth();
  });
  U.clearLab(true);
}
function farm(U, S, need, out) { while (S.en < need) { U.Forge.slots = ['D', 'D', null]; U.Forge.flux = 0; U.fuse(); out.farm++; if (out.farm > 6000) throw new Error('granja infinita'); } }
function guided(U, out) { // sigue la guía de la UI sin conocer la molécula
  for (let s = 0; s < 200 && U.MIS(); s++) {
    const st = U.guideStep(); if (!st) return;
    if (st.k === 'place') U.spawn(st.el);
    else if (st.k === 'bond') U.tapBond(st.bond);
    else if (st.k === 'link') { U.Lab.sel = st.a; U.tapAtom(st.b); }
    else if (st.k === 'autoH') U.autoH();
    else if (st.k === 'synth') { U.synth(); out.guided++; return; }
    else return;
  }
}
function solver() {
  const U = D.ui, keep = JSON.stringify(U.state()), out = { solved: 0, failed: [], farm: 0, guided: 0 };
  U.quiet(true);
  try {
    const S0 = D.newState(); S0.intro = 1; U.setState(S0); U.clearLab(true);
    for (const L of LEVELS) {
      U.state().cur = L.n;
      L.P.forEach((p, i) => {
        const S = U.state(), k = D.pk(L.n, i), tag = L.n + '-' + (i + 1) + ' ';
        try {
          if (p.k === 'b') {
            prep(U, S, p); U.startProblem(L.n, i); const cards = D.allCards(S);
            const score = c => Math.max(BAT.eff(c, BAT.phaseOf(p, 1)), p.ph2 ? BAT.eff(c, BAT.phaseOf(p, 2)) : 0) * c.pow;
            U.startBattle(L.n, i, cards.sort((a, b) => score(b) - score(a)).slice(0, 4).map(c => c.id));
            for (let s = 0; s < 3000 && U.BT(); s++) { const b = U.BT().b; b.deck.forEach((c, q) => { if (U.BT() && BAT.eff(c, b.ph) > 0) U.throwCard(q); }); U.tick(0.1); }
          } else if (p.k === 's') {
            U.startProblem(L.n, i); const so = U.SO(); if (!so) throw new Error('no abrió la destilación');
            so.sol.forEach(([a, b]) => { U.sortTap(a); U.sortTap(b); });
          } else if (p.k === 'r') {
            const rx = REACT.rx[p.id];
            rx.L.forEach(([, id]) => { if (id[0] !== '@' && !S.fr[id]) { U.clearLab(true); U.buildSmiles(DB.comp[id].smiles[0]); U.synth(); } });
            farm(U, S, -REACT.energy(rx), out);
            U.startProblem(L.n, i); rx.L.forEach(([, id]) => U.rxAdd(id));
            if (!DIFF[L.n - 1].bal) { U.React.L = rx.L.map(t => t.slice()); U.React.R = rx.R.map(t => t.slice()); }
            U.react();
          } else {
            U.startProblem(L.n, i);
            if (p.k === 'm') { if (U.Lab.ghost) guided(U, out); else { U.clearLab(true); U.buildSmiles(DB.comp[p.id].smiles[0]); U.synth(); } }
            else if (p.k === 'p') { const ms = DB.poly[p.id].ms; U.Lab.sel = null; for (let q = 0; q < Math.max(3, ms.length * 2); q++) U.spawnMono(ms[q % ms.length]); U.synth(); }
            else { const { it, fl } = recipe(p.r); farm(U, S, -NUC.fuse(it.map(x => NUC.parse(x)), fl).net, out); U.Forge.slots = [it[0] || null, it[1] || null, it[2] || null]; U.Forge.flux = fl; U.fuse(); }
          }
        } catch (e) { out.failed.push(tag + 'excepción: ' + e.message); }
        if (U.MIS()) { out.failed.push(tag + 'misión sin completar' + (U.Lab.ghost ? ' (guía)' : '')); U.failMission('bot'); }
        if (S.prog[k]) out.solved++; else if (!out.failed.some(f => f.startsWith(tag))) out.failed.push(tag + 'sin resolver');
        U.closeModal();
      });
      if (L.n < 10 && U.state().unl !== L.n + 1) out.failed.push('No se abrió el nivel ' + (L.n + 1));
    }
    out.eternio = !!U.state().eternio; out.stars = D.totalStars(U.state());
  } finally { U.quiet(false); U.setState(JSON.parse(keep)); U.clearLab(true); U.closeModal(); }
  return out;
}

/* partidas aleatorias */
function monkey(n, seed) {
  const U = D.ui, r = D.mulberry(seed || 1), keep = JSON.stringify(U.state()), errors = [];
  const pickA = a => a[Math.floor(r() * a.length)];
  let actions = 0; U.quiet(true);
  const elsAll = ['H', 'C', 'N', 'O', 'F', 'Na', 'Mg', 'Al', 'Si', 'P', 'S', 'Cl', 'Ca', 'Fe', 'Cu', 'He', 'Li', 'Ar', 'U', 'Pb'];
  const openP = k => { const S = U.state(), L = 1 + Math.floor(r() * S.unl), i = Math.floor(r() * 10); return (!k || LEVELS[L - 1].P[i].k === k) && D.problemOpen(S, L, i) ? [L, i] : null; };
  const ACTS = {
    spawn: () => U.spawn(pickA(D.labElements(U.state()))),
    tapAtom: () => { const a = pickA(U.Lab.atoms); if (a) U.tapAtom(a.id); },
    tapBond: () => { const b = pickA(U.Lab.bonds); if (b) U.tapBond(b); },
    drop: () => { const a = pickA(U.Lab.atoms), b = pickA(U.Lab.atoms); if (a && b) { a.x = b.x + (r() - .5) * 40; a.y = b.y + (r() - .5) * 40; U.dropAtom(a.id); } },
    synth: () => U.synth(), autoH: () => U.autoH(), undo: () => U.undo(), del: () => { const a = pickA(U.Lab.atoms); if (a) { U.Lab.sel = a.id; U.delSel(); } },
    mono: () => { const m = Object.keys(U.state().fr).filter(id => DB.comp[id] && DB.comp[id].mono); if (m.length) U.spawnMono(pickA(m)); },
    smiles: () => { const c = pickA(Object.values(DB.comp)); U.buildSmiles(pickA(c.smiles)); if (r() < .7) U.synth(); },
    guide: () => { const st = U.guideStep(); if (st && st.k === 'place') U.spawn(st.el); else if (st && st.k === 'bond') U.tapBond(st.bond); },
    problem: () => { const q = openP(); if (q) U.startProblem(q[0], q[1]); },
    battle: () => { const q = openP('b'); if (q) U.startBattle(q[0], q[1], D.allCards(U.state()).slice(0, 4).map(c => c.id)); },
    throw: () => { if (U.BT()) U.throwCard(Math.floor(r() * 4)); },
    tick: () => U.tick(r() * 3),
    fuse: () => { const ks = Object.keys(U.state().nuc); U.Forge.slots = [pickA(ks), r() < .8 ? pickA(ks) : null, r() < .4 ? pickA(ks) : null]; U.Forge.flux = r() < .5 ? 0 : Math.floor(r() * 40); U.fuse(); },
    rx: () => { const ids = [...Object.keys(U.state().fr).filter(id => DB.comp[id]), '@Fe', '@Al', '@Na', '@C', '@S', '@Mg']; if (r() < .3) { U.React.L = []; U.React.R = []; } U.rxAdd(pickA(ids)); if (U.React.L.length) U.rxCoef(r() < .5 ? 'L' : 'R', 0, r() < .5 ? 1 : -1); if (r() < .5) U.react(); },
    rxReal: () => { const rx = pickA(Object.values(REACT.rx)); U.React.L = []; U.React.R = []; rx.L.forEach(([, id]) => U.rxAdd(id)); U.React.L = rx.L.map(t => t.slice()); U.React.R = rx.R.map(t => t.slice()); U.react(); },
    sort: () => { if (!U.SO()) { const q = openP('s'); if (q) U.startProblem(q[0], q[1]); } else U.sortTap(Math.floor(r() * (U.SO().st.length + 1))); },
    hint: () => U.useHint(),
    tab: () => U.setTab(pickA(['lab', 'fr', 'bt', 'tx'])), mode: () => U.setMode(pickA(['mol', 'forge', 'react'])),
    detail: () => { const S = U.state(), ids = [...Object.keys(S.fr), ...Object.keys(S.el).map(s => 'el:' + s)]; if (ids.length) U.detail(pickA(ids)); },
    modal: () => pickA([U.menu, U.guide, U.credits, U.settings, () => U.txLevel(1 + Math.floor(r() * 10))])(),
    close: () => U.closeModal(), render: () => U.render(), flee: () => U.flee(), side: () => U.renderSide(),
    abandon: () => { if (U.MIS()) U.failMission('bot'); }
  };
  const names = Object.keys(ACTS), weights = { spawn: 9, tapAtom: 6, tapBond: 3, drop: 3, synth: 4, autoH: 2, smiles: 2, guide: 3, tick: 5, throw: 5, fuse: 4, rx: 4, sort: 5 };
  const bag = names.flatMap(k => Array(weights[k] || 1).fill(k));
  try {
    for (let g = 0; g < n; g++) {
      const S0 = D.newState(); S0.intro = 1; S0.unl = 1 + Math.floor(r() * 10); S0.cur = S0.unl;
      for (let L = 1; L < S0.unl; L++) for (let i = 0; i < 10; i++) S0.prog[D.pk(L, i)] = 1 + Math.floor(r() * 3);
      elsAll.forEach(s => { if (r() < .6 || s === 'H' || s === 'O') S0.el[s] = 1; });
      ['D', 'He4', 'C12', 'O16', 'Fe56', 'Ru102', 'Pb204', 'U238'].forEach(k => { if (r() < .5) S0.nuc[k] = 1; });
      Object.keys(DB.comp).forEach(id => { if (r() < .25) S0.fr[id] = { c: 1, t: g }; });
      S0.en = Math.floor(r() * 999); S0.set.sandbox = r() < .2 ? 1 : 0;
      U.setState(S0); U.clearLab(true); U.closeModal();
      for (let a = 0; a < 160; a++) {
        const act = pickA(bag); actions++;
        try { ACTS[act](); } catch (e) { errors.push('partida ' + g + ' acción ' + a + ' ' + act + ': ' + e.message); if (errors.length > 40) throw new Error('demasiados errores'); }
        if (a % 20 === 19) {
          const S = U.state(), bad = [];
          if (!Number.isFinite(S.en) || S.en < 0 || S.en > CFG.MAX_ENERGY) bad.push('energía ' + S.en);
          if (!Number.isFinite(S.sc)) bad.push('puntaje');
          U.Lab.bonds.forEach(b => { const x = U.Lab.atoms.find(q => q.id === b.a), y = U.Lab.atoms.find(q => q.id === b.b); if (!x || !y) bad.push('enlace huérfano'); else if (!x.mono && (b.o < 1 || b.o > 3)) bad.push('orden ' + b.o); });
          U.Lab.atoms.forEach(q => { if (!Number.isFinite(q.x) || !Number.isFinite(q.y)) bad.push('posición NaN'); if (!q.mono) { const s = U.Lab.bonds.reduce((t, b) => t + (b.a === q.id || b.b === q.id ? b.o : 0), 0); if (s > D.maxVal(q.el)) bad.push(q.el + ' con ' + s + ' enlaces'); } });
          if (U.Lab.ghost) U.Lab.ghost.atoms.forEach(s => { if (s.f && !U.Lab.atoms.some(q => q.id === s.f)) bad.push('plano apunta a átomo borrado'); });
          const so = U.SO(); if (so) { const cnt = {}; so.st.forEach(t => t.forEach(c => cnt[c] = (cnt[c] || 0) + 1)); if (Object.values(cnt).some(v => v !== SORT.CAP) || so.st.some(t => t.length > SORT.CAP)) bad.push('destilación corrupta'); }
          try { const j = D.sanitize(JSON.parse(JSON.stringify(S))); if (j.v !== 1) bad.push('guardado'); } catch (e) { bad.push('JSON ' + e.message); }
          if (bad.length) errors.push('partida ' + g + ' acción ' + a + ': ' + [...new Set(bad)].join(', '));
        }
      }
      if (U.BT()) { U.flee(); U.tick(.1); }
      if (U.MIS()) U.failMission('bot');
      if (U.SO()) U.squit();
    }
  } catch (e) { errors.push('abortado: ' + e.message); }
  finally { U.quiet(false); U.setState(JSON.parse(keep)); U.clearLab(true); U.closeModal(); }
  return { games: n, actions, errors };
}
DE.test = { selfTest, solver, monkey, simBattle };
})();
